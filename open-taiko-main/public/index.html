<!DOCTYPE html>
<html>
  <head>
    <title>Google</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <meta
      name="description"
      content="パソコンとスマホのブラウザ向けの太鼓の達人シミュレータ 🥁 Taiko no Tatsujin rhythm game simulator for desktop and mobile browsers"
    />

    <script>
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) {
              if (reg && reg.scope && (reg.scope === location.origin + "/" || reg.scope.indexOf("/taiko") !== -1)) {
                reg.unregister().catch(function() {});
              }
            });
          }).catch(function() {});
        }
      } catch (e) {}
    </script>

    <script>
      (function() {
        const T = "Google";
        function cloak() {
          if (document.title !== T) document.title = T;
          let l = document.querySelector("link[rel*='icon']");
          if (!l) {
            l = document.createElement("link");
            l.rel = "icon";
            if (document.head) document.head.appendChild(l);
          }
          if (l && l.getAttribute("href") !== "/favicon.ico") l.setAttribute("href", "/favicon.ico");
        }
        cloak();
        try {
          Object.defineProperty(document, 'title', {
            get: function() { return T; },
            set: function() { return T; },
            configurable: true
          });
        } catch(_) {}
        if (window.MutationObserver && document.head) {
          new MutationObserver(cloak).observe(document.head, { childList: true, subtree: true, characterData: true });
        }
        window.addEventListener("load", cloak);
      })();
    </script>

    <link rel="stylesheet" href="/taiko/src/css/loader.css?v=20261110v2" />
  </head>
  <body>
    <div id="assets"></div>
    <div id="screen" class="pattern-bg"></div>
    <div id="version">
      <a
        href="https://github.com/sammwyy/open-taiko"
        target="_blank"
        id="version-link"
        class="stroke-sub"
        alt="Open Taiko (Version 1.0)"
        >Open Taiko (Version 1.0)</a
      >
    </div>

    <script src="/taiko/src/js/assets.js?v=20261110v2"></script>
    <script src="/taiko/src/js/strings.js?v=20261110v2"></script>
    <script src="/taiko/src/js/browsersupport.js?v=20261110v2"></script>
    <script src="/taiko/src/js/pageevents.js?v=20261110v2"></script>
    <script src="/taiko/src/js/loader.js?v=20261110v2"></script>
    <script src="/taiko/src/js/main.js?v=20261110v2"></script>
  </body>
</html>
